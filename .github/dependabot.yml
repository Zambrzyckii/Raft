version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /Backend/src/RaftServer
      - /Backend/src/RaftDashboard
      - /Backend/tests/RaftServer.Tests
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /Frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - /Backend/src/RaftServer
      - /Backend/src/RaftDashboard
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
