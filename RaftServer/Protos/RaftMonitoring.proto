syntax = "proto3";

option csharp_namespace = "Raft.Grpc";

service RaftMonitoring {
  rpc GetStatus (StatusRequest) returns (StatusResponse);
  rpc SetPaused (SetPausedRequest) returns (SetPausedResponse);
  rpc SetSpeed (SetSpeedRequest) returns (SetSpeedResponse);
  rpc StartSearch (StartSearchRequest) returns (StartSearchResponse);
}

message StatusRequest {
  int64 sinceSeq = 1;
}

message StatusResponse {
  string id = 1;
  string role = 2;
  int32 currentTerm = 3;
  string currentLeader = 4;
  int32 logCount = 5;
  int32 pendingCount = 6;
  bool paused = 7;
  repeated NodeEvent events = 8;
  int64 lastSeq = 9;
  int32 workDelay = 10;
  bool waitingForStart = 11;
}

message NodeEvent {
  int64 seq = 1;
  string kind = 2;
  int32 value = 3;
  string peer = 4;
  int32 term = 5;
}

message SetPausedRequest {
  bool paused = 1;
}

message SetPausedResponse {
  bool paused = 1;
}

message SetSpeedRequest {
  int32 delayMs = 1;
}

message SetSpeedResponse {
  int32 delayMs = 1;
}

message StartSearchRequest {
}

message StartSearchResponse {
  bool waitingForStart = 1;
}
