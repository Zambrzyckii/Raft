services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: raft
      POSTGRES_USER: raft
      POSTGRES_PASSWORD: raft
    ports:
      - "5434:5432"
    volumes:
      - raft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raft"]
      interval: 5s
      retries: 5
      start_period: 5s
  raft:
    image: raft
    build: ./RaftServer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Primes: "Host=postgres;Port=5432;Database=raft;Username=raft;Password=raft"

volumes:
  raft_pgdata:
