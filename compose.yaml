services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - raft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5
      start_period: 5s
  raft:
    image: raft
    build: ./RaftServer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Primes: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      BindHost: "*"
  dashboard:
    image: raft-dashboard
    build:
      context: .
      dockerfile: RaftDashboard/Dockerfile
    depends_on:
      - raft
    environment:
      NodeHost: raft
      GatewayUrl: "http://*:5100"
    ports:
      - "5100:5100"

volumes:
  raft_pgdata:
